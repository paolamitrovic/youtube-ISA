<div class="watch-party-container">
  <div class="header-section">
    <h1>Watch Party Sobe</h1>
    <button class="create-button" (click)="createWatchParty()">Kreiraj novu sobu</button>
  </div>

  <div *ngIf="loading" class="loading">
    <p>Učitavanje soba...</p>
  </div>

  <div *ngIf="!loading && watchParties && watchParties.length > 0" class="watch-party-grid">
    <div 
      *ngFor="let watchParty of watchParties; trackBy: trackByWatchPartyId"
      class="watch-party-card"
      (click)="joinWatchParty(watchParty.id)">
      <div class="watch-party-info">
        <h3>{{ watchParty.name }}</h3>
        <p *ngIf="watchParty.video" class="video-info">
          Video: {{ watchParty.video.title }}
        </p>
        <p *ngIf="!watchParty.video" class="no-video">
          Nema odabranog videa
        </p>
        <p class="members-count">
          {{ (watchParty.members || []).length }} članova
        </p>
      </div>
      <button class="join-button" (click)="joinWatchParty(watchParty.id); $event.stopPropagation()">
        Pridruži se
      </button>
    </div>
  </div>

  <div *ngIf="!loading && (!watchParties || watchParties.length === 0)" class="no-watch-parties">
    <p>Nema dostupnih Watch Party soba. Kreirajte novu sobu!</p>
  </div>
</div>
