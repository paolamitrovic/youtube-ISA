<div class="create-watch-party-container">
  <h1>Kreiraj Watch Party sobu</h1>

  <form [formGroup]="watchPartyForm" (ngSubmit)="onSubmit()" class="watch-party-form">
    <div class="form-group">
      <label for="name">Naziv sobe *</label>
      <input 
        type="text" 
        id="name" 
        formControlName="name" 
        class="form-control"
        placeholder="Unesite naziv sobe">
      <div *ngIf="watchPartyForm.get('name')?.invalid && watchPartyForm.get('name')?.touched" class="error">
        Naziv mora imati najmanje 3 karaktera
      </div>
    </div>

    <div class="form-group">
      <label for="videoId">Video (opciono)</label>
      <select 
        id="videoId" 
        formControlName="videoId" 
        class="form-control">
        <option [value]="null">-- Odaberite video --</option>
        <option *ngFor="let video of videos" [value]="video.id">
          {{ video.title }}
        </option>
      </select>
      <div *ngIf="videosLoading" class="loading-videos">
        Učitavanje videa...
      </div>
    </div>

    <div class="form-actions">
      <button 
        type="submit" 
        class="submit-button"
        [disabled]="watchPartyForm.invalid || loading">
        {{ loading ? 'Kreiranje...' : 'Kreiraj sobu' }}
      </button>
      <button 
        type="button" 
        class="cancel-button"
        (click)="cancel()">
        Otkaži
      </button>
    </div>
  </form>
</div>
